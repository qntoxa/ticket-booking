version: '3.9'

services:
  booking-api:
    build: .
    container_name: ticket-booking-api
    ports:
      - "8081:8081"
    environment:
      - HTTP_ADDR=:8081
      - JWT_SECRET=super-secret-production-key-change-me
      - HOLD_TTL_SECONDS=600
      - CLEANUP_INTERVAL_SECONDS=5
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/booking?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ticket-booking-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=booking
    ports:
      - "5433:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticket-booking-redis
    ports:
      - "6380:6379"

volumes:
  booking_pgdata:
